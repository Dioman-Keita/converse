name: Android APK

# Release: push a tag like `android-v0.2.0` → signed APK attached to a GitHub Release.
# Pull requests touching mobile/ only check that it builds.
on:
  push:
    tags: ["android-v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      # Same key for every release, so installed apps update in place.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: the APK will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build
        run: ./gradlew assembleRelease --console=plain -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "converse-${VERSION_NAME}.apk"
          echo "APK=converse-${VERSION_NAME}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: mobile/${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v') && env.ANDROID_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Converse for Android $VERSION_NAME" \
              --notes "Install the APK on your phone, open Converse and paste the server address printed by start.ps1 / start.sh."
          fi
