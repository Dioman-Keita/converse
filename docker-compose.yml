# Converse — self-hosted stack.
#
#   docker compose up -d                           # local only (http://localhost:3000)
#   docker compose --profile quick-tunnel up -d    # + temporary public URL (no account)
#   docker compose --profile tunnel up -d          # + stable public URL (your domain)
#
# State: the `pgdata` volume (database), the `uploads` volume (voice notes),
# ./backups (daily database dumps + uploads archives — what you copy elsewhere).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: converse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: converse
    volumes:
      # Named volume, not a host folder: Docker Desktop's Windows/macOS file sharing
      # is slow and unreliable for a database (it caused crash/recovery loops).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converse"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No `ports:` on purpose — Postgres is only reachable from the Docker network.

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://converse:${DB_PASSWORD}@db:5432/converse
      PORT: 3000
      # Lets the app log the Quick Tunnel's public address (server/plugins/public-url.ts).
      QUICK_TUNNEL_METRICS_URL: http://quick-tunnel:20241
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Named volume (not a bind mount) so it stays writable by the `node` user on any host.
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/converse-$$(date +%Y%m%d-%H%M%S).dump
          pg_dump -h db -U converse -Fc converse > "$$f" && echo "backup: $$f"
          ls -1t /backups/converse-*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
          u=/backups/converse-uploads-$$(date +%Y%m%d-%H%M%S).tar.gz
          tar -czf "$$u" -C /uploads . && echo "backup: $$u"
          ls -1t /backups/converse-uploads-*.tar.gz | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm --
          sleep "$$BACKUP_INTERVAL"
        done

  # Instant public URL, no Cloudflare account or domain needed.
  # The https://<random>.trycloudflare.com address changes on every restart:
  #   docker compose logs quick-tunnel | grep trycloudflare.com
  quick-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["quick-tunnel"]
    # Metrics server: /quicktunnel returns the assigned hostname, which the app logs.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://app:3000
    depends_on:
      - app

  # Stable URL on your own domain (named tunnel, token from the Cloudflare dashboard).
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
